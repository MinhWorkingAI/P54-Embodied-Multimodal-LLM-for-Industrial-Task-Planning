services:
  ollama:
    image: ollama/ollama:latest
    container_name: p54_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  p54_ros:
    build:
      context: .
      dockerfile: Dockerfile.lab
    platform: linux/amd64
    container_name: p54_ros_pipeline
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BACKEND=ollama
      - ROBOT_BACKEND=ros
      - ROS_DOMAIN_ID=0
    network_mode: host
    volumes:
      - .:/app
    depends_on:
      - ollama
    stdin_open: true
    tty: true

volumes:
  ollama_models: